    <linearGradient id="water" x1="800" y1="80" x2="800" y2="730" gradientUnits="userSpaceOnUse"><stop stop-color="#11b8d5" stop-opacity=".02"/><stop offset=".6" stop-color="#18d4e8" stop-opacity=".18"/><stop offset="1" stop-color="#42f0dc" stop-opacity=".03"/></linearGradient>
    <linearGradient id="grass" x1="800" y1="430" x2="800" y2="1000" gradientUnits="userSpaceOnUse"><stop stop-color="#1b927b"/><stop offset=".4" stop-color="#07564f"/><stop offset="1" stop-color="#032c35"/></linearGradient>
